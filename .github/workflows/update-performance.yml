name: Opdatér performance-data

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC hver dag
  push:
    branches: [master]
    paths:
      - "data/members/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer dependencies
        run: npm ci

      - name: Hent kurser og genberegn performance
        run: node scripts/fetch-performance.mjs

      - name: Commit og push, hvis data ændrede sig
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/performance.json
          git diff --cached --quiet || git commit -m "chore: opdater performance-data"
          git push
