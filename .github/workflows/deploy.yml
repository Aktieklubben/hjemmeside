name: Deploy til GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer dependencies
        run: npm ci

      # Repoet hedder "Aktieklubben.github.io" -> siden ligger på roden.
      # Ethvert andet repo-navn -> siden ligger under /repo-navn/, så
      # Next.js skal bygges med den base path.
      - name: Bestem base path
        id: basepath
        run: |
          if [ "${{ github.event.repository.name }}" = "Aktieklubben.github.io" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Byg Dating CRM
        working-directory: dating-crm-src
        env:
          VITE_BASE: ${{ steps.basepath.outputs.value }}/dating-crm/
        run: |
          npm ci
          npm run build

      - name: Kopiér Dating CRM ind i public/
        run: node scripts/copy-dating-crm.mjs

      - name: Byg
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
